<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Ədəbiyyat & İncəsənət</title>

<style>
body {
  background-color: #f5ecd9;
  font-family: "Georgia", serif;
  color: #3e2f1c;
  margin: 0;
  transition: 0.3s;
}

.dark {
  background-color: #1e1a16;
  color: #e8dcc7;
}

.container {
  max-width: 700px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.post-box {
  background: #fffaf0;
  padding: 15px;
  border: 1px solid #d6c3a3;
  border-radius: 10px;
}

.dark .post-box {
  background: #2b241d;
}

input, textarea {
  width: 100%;
  margin-top: 10px;
  border: none;
  background: transparent;
  font-family: Georgia;
  font-size: 15px;
  outline: none;
}

button {
  margin-top: 10px;
  padding: 10px;
  background: #8b6f47;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

.post {
  background: #fffaf0;
  border-left: 5px solid #8b6f47;
  margin-top: 15px;
  padding: 12px;
  border-radius: 6px;
}

.dark .post {
  background: #2b241d;
}

.author {
  font-weight: bold;
}

.poem {
  white-space: pre-line;
  font-style: italic;
  margin-top: 5px;
}

.like {
  margin-top: 10px;
  cursor: pointer;
}

img {
  max-width: 100%;
  margin-top: 10px;
  border-radius: 6px;
}

.toggle {
  float: right;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>
    ✒️ Ədəbiyyat & İncəsənət
    <span class="toggle" onclick="toggleDark()">🌙</span>
  </h1>

  <div class="post-box">
    <input id="author" placeholder="Müəllif adı">
    <textarea id="content" placeholder="Şeir, fikir və ya yazını yaz..."></textarea>
    <input type="file" id="image">
    <button onclick="addPost()">Paylaş</button>
  </div>

  <div id="posts"></div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem("posts")) || [];

function renderPosts() {
  const container = document.getElementById("posts");
  container.innerHTML = "";

  posts.forEach((p, index) => {
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <div class="author">✍️ ${p.author}</div>
      <div class="poem">${p.content}</div>
      ${p.image ? `<img src="${p.image}">` : ""}
      <div class="like" onclick="likePost(${index})">❤️ ${p.likes}</div>
    `;

    container.appendChild(div);
  });
}

function addPost() {
  const author = document.getElementById("author").value || "Anonim";
  const content = document.getElementById("content").value;
  const file = document.getElementById("image").files[0];

  if (!content) return alert("Boş olmaz");

  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      savePost(author, content, e.target.result);
    };
    reader.readAsDataURL(file);
  } else {
    savePost(author, content, null);
  }
}

function savePost(author, content, image) {
  posts.unshift({
    author,
    content,
    image,
    likes: 0
  });

  localStorage.setItem("posts", JSON.stringify(posts));

  document.getElementById("author").value = "";
  document.getElementById("content").value = "";
  document.getElementById("image").value = "";

  renderPosts();
}

function likePost(index) {
  posts[index].likes++;
  localStorage.setItem("posts", JSON.stringify(posts));
  renderPosts();
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

renderPosts();
</script>

</body>
</html>
